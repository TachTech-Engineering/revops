[project]
name = "panther-dashboard-backend"
version = "1.0.0"
description = "FastAPI backend for Panther Dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# N815: pydantic request/response models use camelCase field names because they ARE
# the JSON wire contract consumed by the frontend (see pantherApi.ts). Renaming them
# would break the API; aliasing every field adds noise for no behavioral gain.
"app/api/v1/alerts.py" = ["N815", "N803"]
"app/api/v1/analytics.py" = ["N815"]
"app/api/v1/converter.py" = ["N815"]
"app/api/v1/dashboards.py" = ["N815"]
"app/api/v1/queries.py" = ["N815"]
"app/api/v1/rules.py" = ["N815", "N803"]
# N803: FastAPI derives query/form parameter names from the argument names, so
# camelCase args (pageSize, detectionId, logTypes) are part of the HTTP contract.
# twilio_webhook.py: Digits/From/Body are the exact form fields Twilio POSTs.
"app/api/v1/twilio_webhook.py" = ["N803"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: behavioral test requiring a real Postgres (opt-in; skipped when no DB is reachable). Run with `pytest -m db`; exclude with `pytest -m \"not db\"`.",
]
