# Alembic configuration for the panther-dashboard backend.
#
# The migration environment lives inside the application package
# (app/db/alembic) so it ships in the Docker image, which only copies app/.
#
# The database URL is resolved in env.py:
#   1. sqlalchemy.url set programmatically (app/db/run_migrations.py does this)
#   2. the DATABASE_URL environment variable
#   3. app.config.settings.database_url (local dev fallback)

[alembic]
script_location = %(here)s/app/db/alembic
prepend_sys_path = %(here)s

# Resolved in env.py -- intentionally left blank here.
sqlalchemy.url =

# Template for new migration files.
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
