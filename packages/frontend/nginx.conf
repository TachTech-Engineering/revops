server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---------------------------------------------------
    # NOTE nginx add_header inheritance: a location block that declares ANY
    # add_header of its own drops every header inherited from this level.
    # The static-assets location below has its own add_header (Cache-Control),
    # so it re-declares all four security headers -- keep both lists in sync.
    #
    # CSP allowances:
    # - https://cdn.jsdelivr.net in script/style/font-src: @monaco-editor/react
    #   loads monaco-editor (loader.js, editor css, codicon font, worker
    #   scripts via blob importScripts) from jsdelivr by default.
    # - worker-src blob:: monaco creates its web workers from blob: URLs.
    # - style-src 'unsafe-inline': Tailwind-generated inline style attributes,
    #   monaco and reactflow inject inline styles.
    # - connect-src ws:/wss:: useWebSocket connects to /api/v1/ws/alerts on the
    #   page's own host (or VITE_API_BASE_URL); 'self' does not reliably match
    #   ws:/wss: schemes in all browsers, and the host isn't known at build
    #   time, so the schemes are allowed.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' ws: wss: https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing - serve index.html for all routes
    # (no add_header here, so the server-level security headers apply)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    # default_type (not add_header Content-Type) so the server-level
    # security headers are still inherited.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declared: add_header above drops inherited server-level headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' ws: wss: https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
