<svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="revops-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="revops-needle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#revops-bg)" />

  <!-- Inner dark circle for gauge face -->
  <circle cx="32" cy="32" r="24" fill="#0f172a" />

  <!-- Gauge arc background -->
  <path d="M 12 40 A 22 22 0 1 1 52 40" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />

  <!-- Active gauge fill -->
  <path d="M 12 40 A 22 22 0 0 1 44 14.5" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />

  <!-- Needle -->
  <g transform="rotate(45, 32, 38)">
    <polygon points="32,16 29,38 32,40 35,38" fill="url(#revops-needle)" />
  </g>

  <!-- Center hub -->
  <circle cx="32" cy="38" r="5" fill="#f8fafc" />
  <circle cx="32" cy="38" r="3" fill="#1e293b" />
</svg>
