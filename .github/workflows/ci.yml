name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, import, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check app

      - name: Import smoke test
        run: python -c "import app.main"

      - name: Tests (pytest, DB-free)
        run: |
          # This job has no database; run only the DB-free suite. The DB-backed
          # behavioral tests (marked `db`) run in the `backend-db` job below.
          # Tests are added incrementally; skip cleanly while none exist.
          if find tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null | grep -q .; then
            pytest -m "not db"
          else
            echo "No test files found under tests/ - skipping pytest."
          fi

  backend-db:
    name: Backend (DB behavioral tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Real Postgres for the harness; dev environment + default SECRET_KEY so
      # config validation passes without a real secret.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/revops_test
      ENVIRONMENT: development
      SECRET_KEY: dev-secret-key-change-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: DB behavioral tests (pytest -m db)
        run: pytest -m db -v

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Build (strict)
        run: pnpm --filter frontend build:strict

  schema-drift:
    name: Frontend (OpenAPI schema drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuilds the backend image, dumps app.openapi() (no DB needed) into
      # openapi.json, then regenerates src/api/schema.d.ts from it. Docker is
      # preinstalled on ubuntu-latest runners.
      - name: Regenerate OpenAPI types from the backend
        run: pnpm --filter frontend codegen:all

      # The drift alarm: any backend API change not reflected in the committed
      # schema.d.ts makes this fail. Fix by running `pnpm codegen:all` in
      # packages/frontend and committing the updated schema.d.ts.
      - name: Fail on schema drift
        run: |
          git diff --exit-code -- packages/frontend/src/api/schema.d.ts \
            || { echo "::error::packages/frontend/src/api/schema.d.ts is out of date. Run 'pnpm codegen:all' in packages/frontend and commit the result."; exit 1; }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f packages/backend/Dockerfile -t revops-backend:ci packages/backend

      - name: Build frontend image
        run: docker build -f packages/frontend/Dockerfile -t revops-frontend:ci packages/frontend

  k8s:
    name: Kustomize overlays render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render production overlay
        run: kubectl kustomize k8s/overlays/production > /dev/null

      - name: Render staging overlay
        run: kubectl kustomize k8s/overlays/staging > /dev/null
