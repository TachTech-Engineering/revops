services:
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "514:514/udp"   # Syslog UDP (UniFi)
      - "514:514/tcp"   # Syslog TCP (UniFi)
    environment:
      - PANTHER_API_HOST=${PANTHER_API_HOST}
      - PANTHER_API_TOKEN=${PANTHER_API_TOKEN}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+asyncpg://panther:panther@postgres:5432/panther_dashboard
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000
      # Telephony service (mock for local dev, twilio for production)
      - TELEPHONY_PROVIDER=${TELEPHONY_PROVIDER:-mock}
      - TELEPHONY_MOCK_ENDPOINT=http://telephony-mock:50051
      - TELEPHONY_ENABLED=true
      # Twilio credentials (set these in .env for production)
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=panther
      - POSTGRES_PASSWORD=panther
      - POSTGRES_DB=panther_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panther -d panther_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mock Telephony Service for local development
  # Simulates phone calls and SMS - logs to console
  # For production, configure real Fonoster or Twilio
  telephony-mock:
    image: python:3.11-slim
    ports:
      - "50051:50051"
    volumes:
      - ./packages/backend/telephony-mock:/app
    working_dir: /app
    command: >
      bash -c "pip install fastapi uvicorn --quiet && python -m uvicorn server:app --host 0.0.0.0 --port 50051"
    environment:
      - LOG_LEVEL=INFO

  # Mail server for local testing (captures emails)
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  redis_data:
  postgres_data:
