services:
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount the local panther_sdk for development
      - C:/Source/panther_sdk:/app/panther_sdk_repo:ro
    environment:
      - PANTHER_API_HOST=${PANTHER_API_HOST}
      - PANTHER_API_TOKEN=${PANTHER_API_TOKEN}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+asyncpg://panther:panther@postgres:5432/panther_dashboard
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000
      - PYTHONPATH=/app:/app/panther_sdk_repo
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=panther
      - POSTGRES_PASSWORD=panther
      - POSTGRES_DB=panther_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panther -d panther_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
