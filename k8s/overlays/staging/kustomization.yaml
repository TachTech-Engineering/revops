apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: revops-staging

resources:
  - ../../base

namePrefix: staging-

patches:
  - path: frontend-patch.yaml
  - path: backend-patch.yaml
  # Staging serves a single host; the managed cert covers only it.
  - target:
      kind: ManagedCertificate
      name: revops-cert
    patch: |-
      - op: replace
        path: /spec/domains
        value:
          - staging.ttrevops.com
  # namePrefix renames the cert/FrontendConfig objects to staging-*, but the
  # ingress annotation values that reference them are not auto-rewritten, so
  # point them at the prefixed names explicitly.
  - target:
      kind: Ingress
      name: revops-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/networking.gke.io~1managed-certificates
        value: staging-revops-cert
      - op: replace
        path: /metadata/annotations/networking.gke.io~1v1beta1.FrontendConfig
        value: staging-revops-frontend-config

# NOTE: staging is NOT currently stood up. Standing it up requires, in the
# revops-staging namespace: a database (its own postgres or Cloud SQL -- the
# base no longer wires the Auth Proxy sidecar), the backend-secrets and
# backend-encryption-key Secrets, an iap-secret + a patch renaming the
# services' backend-config annotation to staging-iap-config (namePrefix does
# not rewrite annotation values), and a staging.ttrevops.com DNS A record.
configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=https://staging.ttrevops.com
      - ENVIRONMENT=staging
      - PUBLIC_BASE_URL=https://staging.ttrevops.com

images:
  - name: us-docker.pkg.dev/revops-486917/gcr.io/panther-dashboard-frontend
    newTag: staging
  - name: us-docker.pkg.dev/revops-486917/gcr.io/panther-dashboard-backend
    newTag: staging
