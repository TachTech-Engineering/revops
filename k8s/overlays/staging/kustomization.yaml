apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: panther-dashboard-staging

resources:
  - ../../base

namePrefix: staging-

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=https://staging.panther-dashboard.example.com

images:
  - name: gcr.io/pantherutil/panther-dashboard-frontend
    newTag: staging
  - name: gcr.io/pantherutil/panther-dashboard-backend
    newTag: staging
