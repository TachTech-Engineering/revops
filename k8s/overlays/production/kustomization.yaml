apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: panther-dashboard

resources:
  - ../../base
  - hpa.yaml

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=https://panther-dashboard.example.com

images:
  - name: gcr.io/pantherutil/panther-dashboard-frontend
    newTag: v1.0.0
  - name: gcr.io/pantherutil/panther-dashboard-backend
    newTag: v1.0.0
