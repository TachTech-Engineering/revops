apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: revops

resources:
  - ../../base
  - hpa.yaml

patches:
  - path: frontend-patch.yaml
  - path: backend-patch.yaml

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - CORS_ORIGINS=https://ttrevops.com,https://www.ttrevops.com
      # Production Cloud SQL instance (created by scripts/gke-cloudsql-setup.sh).
      # Distinct from the staging instance.
      - CLOUD_SQL_INSTANCE=revops-486917:us-central1:revops-db

images:
  - name: us-docker.pkg.dev/revops-486917/gcr.io/panther-dashboard-frontend
    newTag: latest
  - name: us-docker.pkg.dev/revops-486917/gcr.io/panther-dashboard-backend
    newTag: latest
