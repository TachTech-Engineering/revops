# NOTE: This manifest is intentionally NOT included in the *base* kustomization.
#
# PRODUCTION (decision 2026-08-13): the revops namespace runs an UNMANAGED
# in-cluster postgres (Deployment "postgres", PVC "postgres-pvc", 10Gi,
# user/db "revops"), deployed 2026-02 and holding live data. It is deliberately
# left out of the base kustomization so a deploy can never restart or clobber
# the database. The backend reaches it via DATABASE_URL in the backend-secrets
# Secret (postgresql+asyncpg://...@postgres:5432/revops). If it ever moves to
# Cloud SQL, see scripts/gke-cloudsql-setup.sh and git history for the Auth
# Proxy sidecar wiring.
#
# This file declared emptyDir until 2026-08-17 while production ran on a PVC.
# It was described as "reference only", but a reference that does not match
# reality is a trap: `kubectl apply -f` against the revops namespace would have
# rolled the live database onto ephemeral storage and destroyed it, orphaning
# postgres-pvc. It now declares the PVC production actually uses, so applying
# it is a no-op rather than a data-loss event.
#
# The staging overlay DOES include this file, so staging gets its own
# namePrefixed postgres (staging-postgres / staging-postgres-pvc).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: revops
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              value: revops
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # standard-rwo supports volume expansion, so this can be grown in place.
  storageClassName: standard-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
