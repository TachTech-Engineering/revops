apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://ttrevops.com,https://www.ttrevops.com"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Alembic (the backend-migrate Job, run by gke-deploy.sh before every
  # rollout) is the sole schema owner; the app must not create_all at startup.
  # First proven on the 2026-08-13 production deploy (stamp + upgrade).
  AUTO_MIGRATE: "false"
  # DATABASE_URL deliberately does NOT live here: it contains the DB password
  # and belongs in the backend-secrets Secret (the pre-hardening deploy kept it
  # in this ConfigMap; that was fixed 2026-08-13). ENVIRONMENT and
  # PUBLIC_BASE_URL are set per-overlay.
