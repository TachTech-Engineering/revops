apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://panther-dashboard.example.com"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Cloud SQL instance connection name (project:region:instance) consumed by the
  # Cloud SQL Auth Proxy sidecar via $(CLOUD_SQL_INSTANCE) arg substitution.
  # This base value is a PLACEHOLDER: each overlay MUST override it with the real
  # per-environment instance (staging vs production point at DIFFERENT instances).
  CLOUD_SQL_INSTANCE: "revops-486917:us-central1:PLACEHOLDER-set-per-env"
