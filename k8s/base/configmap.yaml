apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://ttrevops.com,https://www.ttrevops.com"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # DATABASE_URL deliberately does NOT live here: it contains the DB password
  # and belongs in the backend-secrets Secret (the pre-hardening deploy kept it
  # in this ConfigMap; that was fixed 2026-08-13). ENVIRONMENT and
  # PUBLIC_BASE_URL are set per-overlay.
