apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  labels:
    app: backend-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      serviceAccountName: backend
      restartPolicy: Never
      # Pod-level hardening (see backend-deployment.yaml for the full rationale).
      # runAsNonRoot is safe: migrate uses the backend image (USER appuser,
      # uid 1000).
      #
      # DATABASE: migrations run against the in-cluster postgres Service via
      # DATABASE_URL from backend-secrets (same as the backend Deployment).
      # The Cloud SQL Auth Proxy native-sidecar variant is in git history if
      # Cloud SQL is adopted later.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: us-docker.pkg.dev/revops-486917/gcr.io/panther-dashboard-backend:latest
          command: ["python", "-m", "app.db.run_migrations"]
          # Same non-root user as the backend deployment: appuser = 1000:1000
          # (verified from packages/backend/Dockerfile). The migration runner
          # needs no Linux capabilities. seccomp comes from the pod.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
