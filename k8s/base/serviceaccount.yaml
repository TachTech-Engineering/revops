# Kubernetes ServiceAccount for the backend workloads (Deployment + migration Job).
#
# It is bound to the Google Service Account (GSA) revops-backend@revops-486917
# via GKE Workload Identity. The GSA holds roles/cloudsql.client, which is what
# the Cloud SQL Auth Proxy sidecar uses to open an mTLS tunnel to the instance.
#
# The Workload Identity binding (roles/iam.workloadIdentityUser on the GSA) is
# created by scripts/gke-cloudsql-setup.sh for BOTH:
#   - revops/backend            (production / base)
#   - revops-staging/staging-backend  (staging overlay renames this KSA via namePrefix)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app: backend
  annotations:
    iam.gke.io/gcp-service-account: revops-backend@revops-486917.iam.gserviceaccount.com
