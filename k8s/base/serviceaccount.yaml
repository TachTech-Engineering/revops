# Kubernetes ServiceAccount for the backend workloads (Deployment + migration Job).
#
# Currently a plain KSA with no Workload Identity binding: the backend talks to
# the in-cluster postgres, not Cloud SQL. If Cloud SQL is adopted later, restore
# the iam.gke.io/gcp-service-account annotation (revops-backend@revops-486917)
# and run scripts/gke-cloudsql-setup.sh, which creates the GSA and the
# roles/iam.workloadIdentityUser bindings for BOTH:
#   - revops/backend            (production / base)
#   - revops-staging/staging-backend  (staging overlay renames this KSA via namePrefix)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app: backend
