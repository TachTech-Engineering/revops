apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: revops-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "panther-dashboard-ip"
    networking.gke.io/managed-certificates: "revops-cert"
    networking.gke.io/v1beta1.FrontendConfig: "revops-frontend-config"
spec:
  rules:
    - http:
        paths:
          - path: /api/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80
