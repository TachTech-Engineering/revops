apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      # Pod-level hardening. runAsNonRoot is safe here: the backend image's
      # USER is appuser (uid 1000, verified in packages/backend/Dockerfile's
      # `useradd`), so the kubelet's runAsNonRoot admission check passes.
      #
      # DATABASE: the backend connects to the in-cluster postgres Service
      # (deployed 2026-02, PVC postgres-pvc, deliberately NOT managed by this
      # kustomization -- see postgres-deployment.yaml). DATABASE_URL lives in
      # the backend-secrets Secret. The Cloud SQL Auth Proxy sidecar variant
      # that used to live here is preserved in git history (and in
      # migration-job.yaml history) if Cloud SQL is adopted later.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: us-docker.pkg.dev/revops-486917/gcr.io/panther-dashboard-backend:latest
          # uid/gid 1000 = appuser, created by `useradd --create-home appuser`
          # in packages/backend/Dockerfile on python:3.11-slim. Verified against
          # the pinned base image: useradd assigns the first free id >= UID_MIN
          # (1000), so appuser is deterministically 1000:1000. Pinning the
          # numeric uid also lets the kubelet satisfy runAsNonRoot (a bare
          # runAsNonRoot with a non-numeric image USER cannot be verified).
          # uvicorn binds :8000 and syslog :5514 (all unprivileged), so no
          # capabilities are required -- drop them all. seccomp comes from the pod.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 5514
              protocol: UDP
              name: syslog-udp
            - containerPort: 5514
              protocol: TCP
              name: syslog-tcp
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          env:
            # Fernet key for connector-credential encryption. Kept in its own
            # Secret (predates backend-secrets); rotating it invalidates all
            # stored SSO/LLM credentials, so it is managed separately.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-encryption-key
                  key: ENCRYPTION_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 5
            failureThreshold: 18  # allows ~90s for DB connection retries at startup
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  annotations:
    # IAP (Identity-Aware Proxy) gates all ingress traffic; the BackendConfig
    # (iap-backendconfig.yaml) references the iap-secret OAuth client creds,
    # which are provisioned out-of-band and must exist in the namespace.
    cloud.google.com/backend-config: '{"default": "iap-config"}'
    cloud.google.com/neg: '{"ingress":true}'
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
