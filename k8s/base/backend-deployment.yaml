apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Workload Identity: the KSA is bound to revops-backend@revops-486917 which
      # holds roles/cloudsql.client. The Cloud SQL Auth Proxy sidecar uses it.
      serviceAccountName: backend
      # Pod-level hardening shared by both containers. runAsNonRoot is safe here:
      # the backend image's USER is appuser (uid 1000, verified in
      # packages/backend/Dockerfile's `useradd`) and the proxy image is
      # distroless nonroot (uid 65532) -- both non-root, so the kubelet's
      # runAsNonRoot admission check passes. Deliberately NO pod-level runAsUser:
      # that would override the proxy's own 65532 uid; the backend uid is pinned
      # at the container level instead.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Native sidecar (initContainer with restartPolicy: Always) for the Cloud
      # SQL Auth Proxy v2. REQUIRES GKE 1.29+ (SidecarContainers is GA). The
      # native-sidecar pattern guarantees the proxy is started and Ready BEFORE
      # the backend container, so the app's startupProbe DB-retry window sees a
      # working 127.0.0.1:5432 tunnel, and the proxy stays up for the pod's life.
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always  # makes this a native sidecar (GKE 1.29+)
          args:
            # CLOUD_SQL_INSTANCE (project:region:instance) comes from the
            # backend-config ConfigMap; k8s substitutes $(VAR) in args when the
            # var is declared in this container's env.
            - "--address=127.0.0.1"
            - "--port=5432"
            - "--structured-logs"
            - "--admin-port=9091"
            - "--quitquitquit"
            - "$(CLOUD_SQL_INSTANCE)"
          env:
            - name: CLOUD_SQL_INSTANCE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: CLOUD_SQL_INSTANCE
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            # Cloud SQL proxy only opens a local listener on 127.0.0.1:5432
            # (unprivileged port) and outbound connections -- it needs no Linux
            # capabilities, so drop them all. seccomp is inherited from the pod.
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: backend
          image: us-docker.pkg.dev/revops-486917/gcr.io/panther-dashboard-backend:latest
          # uid/gid 1000 = appuser, created by `useradd --create-home appuser`
          # in packages/backend/Dockerfile on python:3.11-slim. Verified against
          # the pinned base image: useradd assigns the first free id >= UID_MIN
          # (1000), so appuser is deterministically 1000:1000. Pinning the
          # numeric uid also lets the kubelet satisfy runAsNonRoot (a bare
          # runAsNonRoot with a non-numeric image USER cannot be verified).
          # uvicorn binds :8000 and syslog :5514 (all unprivileged), so no
          # capabilities are required -- drop them all. seccomp comes from the pod.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 5514
              protocol: UDP
              name: syslog-udp
            - containerPort: 5514
              protocol: TCP
              name: syslog-tcp
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 5
            failureThreshold: 18  # allows ~90s for DB connection retries at startup
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
