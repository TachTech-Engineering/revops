apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: us-docker.pkg.dev/revops-486917/gcr.io/panther-dashboard-frontend:latest
          # Stock nginx:alpine: the master runs as root (image /etc/nginx/nginx.conf
          # has `user nginx;`) and forks workers as the nginx user (uid 101).
          # We deliberately do NOT set runAsNonRoot here -- that needs the
          # nginx-unprivileged image (a Dockerfile change, out of scope) and
          # would break this image.
          #
          # Capabilities: `drop: [ALL]` + a minimal add-back. NET_BIND_SERVICE
          # alone (the naive choice) is NOT enough -- verified against the pinned
          # image, nginx then dies at startup with
          #   chown("/var/cache/nginx/client_temp", 101) failed (Operation not permitted)
          # because a root master that drops to the nginx user needs CHOWN (temp
          # dirs) and SETUID/SETGID (worker fork), plus NET_BIND_SERVICE to bind
          # :80. This exact set was verified to start clean and serve HTTP 200.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  annotations:
    # IAP gates all ingress traffic (see iap-backendconfig.yaml).
    cloud.google.com/backend-config: '{"default": "iap-config"}'
    cloud.google.com/neg: '{"ingress":true}'
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
